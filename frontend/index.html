<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da Velha | Acesso</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js" defer></script>
  <script src="usuarios.js" defer></script>
</head>
<body>
  <main class="card home-card auth-card">
    <p class="eyebrow">JOGO DA VELHA</p>
    <h1>Bem-vindo</h1>
    <p class="description">Entre ou crie uma conta para ver quem está online.</p>

    <div class="auth-tabs" role="tablist" aria-label="Acesso à conta">
      <button class="auth-tab active" id="login-tab" type="button" role="tab"
              aria-selected="true" aria-controls="login-panel">Login</button>
      <button class="auth-tab" id="register-tab" type="button" role="tab"
              aria-selected="false" aria-controls="register-panel">Cadastro</button>
    </div>

    <section id="login-panel" role="tabpanel" aria-labelledby="login-tab">
      <form id="login-form" class="auth-form">
        <label for="login-username">Login</label>
        <input id="login-username" name="login" autocomplete="username" required>
        <label for="login-password">Senha</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button class="button primary" type="submit">Entrar</button>
      </form>
    </section>

    <section id="register-panel" role="tabpanel" aria-labelledby="register-tab" hidden>
      <form id="register-form" class="auth-form">
        <label for="register-username">Login</label>
        <input id="register-username" name="login" autocomplete="username" required>
        <label for="register-password">Senha</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" required>
        <label for="register-password-repeat">Repetir senha</label>
        <input id="register-password-repeat" name="passwordRepeat" type="password" autocomplete="new-password" required>
        <button class="button primary" type="submit">Criar conta</button>
      </form>
    </section>

    <p class="connection-status" id="connection-status" aria-live="polite"></p>
    <p class="error-message" id="error-message" role="alert" hidden></p>
    <a class="secondary-link" href="conexao/ping-pong.html">Testar conexão com servidor</a>
  </main>
</body>
</html>
